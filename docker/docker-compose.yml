# Two compose services: `new_member` (default) and `neil`.
# Both use host networking so DDS discovery can travel over the Tailscale
# interface on the host. On macOS/Windows Docker Desktop, `network_mode: host`
# is limited — Linux is the supported path for the class VPN setup.
services:
  new_member:
    build:
      context: .
    image: mfe/a5:humble
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - GITHUB_USER=${GITHUB_USER:?set GITHUB_USER=<your-github-handle> before `docker compose up`}
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - A5_NEIL_HOST=${A5_NEIL_HOST:-neil.tailnet}
    volumes:
      - ../ros2_ws:/workspace
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: bash

  neil:
    build:
      context: .
    image: mfe/a5:humble
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - A5_NEIL_HOST=localhost
    volumes:
      - ../ros2_ws:/workspace
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: bash
