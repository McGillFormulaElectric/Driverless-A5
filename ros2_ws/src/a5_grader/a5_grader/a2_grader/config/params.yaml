# Neil-side scenario parameters for MFE A2.
#
# The '/**' wildcard applies these to every node in the launch — the concrete
# nodes below are signal_publisher and grader, and each only reads the keys it
# declares, so unrelated keys are silently ignored.

signal_publisher:
  ros__parameters:
    signal_hz: 20.0
    f1: 0.5
    a1: 1.0
    f2: 5.0
    a2: 0.6
    noise_std: 0.3
    seed: 20260909

grader:
  ros__parameters:
    alpha: 0.1
    match_window: 200
    mse_tolerance: 0.02
    discovery_period_s: 2.0
    grade_period_s: 2.0
